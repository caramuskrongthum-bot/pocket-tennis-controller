<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Tennis Controller</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: #fff; padding: 20px; }
        button { font-size: 18px; padding: 16px 32px; border-radius: 12px; background: #0284c7; color: white; border: none; font-weight: bold; width: 100%; max-width: 300px; }
        .status { margin-top: 20px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>
    <h2>🎾 Pocket Tennis Controller</h2>
    <p>สแกนต่อสำเร็จแล้ว กดปุ่มด้านล่างเพื่อเริ่มเหวี่ยงมือถือ</p>
    
    <button id="startBtn" onclick="initController()">เชื่อมต่อเซนเซอร์ & เริ่มเล่น</button>
    <div class="status" id="status">สถานะ: รอการกดเริ่ม...</div>

    <script>
        // ดึง ID เครื่องคอมพิวเตอร์จาก Parameter ใน URL (ที่แสกนมาจาก QR Code)
        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('gameId');

        let peer;
        let conn;

        function initController() {
            // ขออนุญาตใช้ Gyro/Accel ใน iOS และ Android
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(response => {
                    if (response === 'granted') connectToGame();
                    else alert("ต้องอนุญาตการใช้งานเซนเซอร์ก่อนครับ");
                });
            } else {
                connectToGame();
            }
        }

        function connectToGame() {
            document.getElementById("status").innerText = "กำลังเชื่อมต่อกับเกม...";
            peer = new Peer();

            peer.on('open', () => {
                conn = peer.connect(hostId);
                
                conn.on('open', () => {
                    document.getElementById("status").innerText = "🟢 เชื่อมต่อสำเร็จ! พร้อมเหวี่ยงมือถือเล่นได้เลย";
                    document.getElementById("status").style.color = "#4ade80";
                    startMotionSender();
                });

                conn.on('error', (err) => {
                    document.getElementById("status").innerText = "🔴 เชื่อมต่อไม่สำเร็จ: " + err;
                });
            });
        }

        function startMotionSender() {
            window.addEventListener('devicemotion', (event) => {
                if (!conn || !conn.open) return;

                let gx = event.rotationRate ? event.rotationRate.beta || 0 : 0;
                let gy = event.rotationRate ? event.rotationRate.gamma || 0 : 0;
                let gz = event.rotationRate ? event.rotationRate.alpha || 0 : 0;

                let ax = event.acceleration ? event.acceleration.x || 0 : 0;
                let ay = event.acceleration ? event.acceleration.y || 0 : 0;
                let az = event.acceleration ? event.acceleration.z || 0 : 0;

                // ส่งค่าผ่าน WebRTC DataChannel ไปยัง Unity Direct
                conn.send(`${gx.toFixed(2)},${gy.toFixed(2)},${gz.toFixed(2)},${ax.toFixed(2)},${ay.toFixed(2)},${az.toFixed(2)}`);
            });
        }
    </script>
</body>
</html>
