<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Controller</title>
    <!-- โหลด PeerJS ให้ชัวร์ว่าเป็น HTTPS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: #fff; padding: 20px; }
        button { font-size: 20px; padding: 16px 32px; border-radius: 12px; background: #0284c7; color: white; border: none; font-weight: bold; width: 100%; margin-top: 20px; }
        .status { margin-top: 20px; font-size: 16px; color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🎾 Tennis Motion Controller</h2>
    <div id="status" class="status">🔴 ยังไม่ได้กดเชื่อมต่อ</div>
    <button id="startBtn" onclick="initController()">1. อนุญาตเซนเซอร์ & เชื่อมต่อ</button>

    <script>
        // ดึงค่า gameId จาก URL ที่ได้จากการสแกน QR Code
        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('gameId');

        let peer;
        let conn;

        function initController() {
            if (!hostId) {
                alert("ไม่พบรหัสห้อง (gameId)! กรุณาสแกน QR Code จากหน้าจอเกมใหม่อีกครั้ง");
                return;
            }

            // ขออนุญาตใช้ Gyroscope ใน iOS / Android
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(response => {
                    if (response === 'granted') startPeer();
                    else alert("ต้องกดอนุญาตใช้งาน Motion Sensor ก่อนเล่นนะครับ");
                }).catch(console.error);
            } else {
                startPeer();
            }
        }

        function startPeer() {
            document.getElementById("status").innerText = "🟡 กำลังค้นหาเครื่องเกม ID: " + hostId;
            
            // สร้าง Peer สำหรับมือถือ
            peer = new Peer();

            peer.on('open', (id) => {
                // ยิงคำขอเชื่อมต่อไปยัง Unity WebGL ตาม gameId
                conn = peer.connect(hostId);

                conn.on('open', () => {
                    document.getElementById("status").innerText = "🟢 เชื่อมต่อสำเร็จ! เหวี่ยงมือถือได้เลย";
                    document.getElementById("status").style.color = "#4ade80";
                    startSendingMotion();
                });

                conn.on('error', (err) => {
                    document.getElementById("status").innerText = "🔴 เชื่อมต่อไม่สำเร็จ: " + err;
                });
            });

            peer.on('error', (err) => {
                document.getElementById("status").innerText = "🔴 เกิดข้อผิดพลาด: " + err.type;
            });
        }

        function startSendingMotion() {
            window.addEventListener('devicemotion', (event) => {
                if (!conn || !conn.open) return;

                let gx = event.rotationRate ? event.rotationRate.beta || 0 : 0;
                let gy = event.rotationRate ? event.rotationRate.gamma || 0 : 0;
                let gz = event.rotationRate ? event.rotationRate.alpha || 0 : 0;

                // ส่งค่า Gyro เป็นข้อความชุดเดียวกันเข้า Unity
                let dataString = `${gx.toFixed(2)},${gy.toFixed(2)},${gz.toFixed(2)},0,0,0`;
                conn.send(dataString);
            });
        }
    </script>
</body>
</html>
